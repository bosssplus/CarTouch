name: Build CarTouch

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install platformio

      # 1) Compile firmware (main health check)
      - run: pio run

      # 2) Web files in data/ -> filesystem image
      - run: pio run -t buildfs

      # 3) Static analysis (informational only)
      - run: pio check --skip-packages
        continue-on-error: true

      # 4) Download from the Actions tab: firmware.bin, bootloader.bin,
      #    partitions.bin, spiffs.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cartouch-firmware
          path: .pio/build/*/*.bin
