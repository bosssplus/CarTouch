name: Build Firmware

# اجرا: با هر push و Pull Request (روی همه برنچ‌ها)، و امکان اجرای دستی از تب Actions
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (esp32-s3-devkitc-1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # کش کردن کل دایرکتوری PlatformIO (پکیج‌ها/پلتفرم‌ها) برای سرعت بیشتر در اجراهای بعدی
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # 1) کامپایل فریمویر - مرحله اصلی تست/اعتبارسنجی
      #    اگه کد خطای کامپایل داشته باشه، اینجا fail میشه
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      # 2) ساخت ایمیج فایل‌سیستم از پوشه data/ (index.html, app.js, style.css, dbc/*)
      #    بدون این مرحله spiffs.bin ساخته نمیشه و webserver نمی‌تونه فایل‌های وب رو سرو کنه
      - name: Build filesystem image (SPIFFS)
        run: pio run -e esp32-s3-devkitc-1 -t buildfs

      # 3) تحلیل استاتیک - فقط اطلاع‌رسانی، بیلد رو fail نمی‌کنه
      - name: Static analysis
        run: pio check -e esp32-s3-devkitc-1 --skip-packages
        continue-on-error: true

      # 3.5) رمزگشایی بک‌ترِیس کرش (Guru Meditation) - فقط اطلاع‌رسانی
      #    آدرس‌ها را از لاگ سریال بردار و در BACKTRACE بگذار.
      #    اگر SHA اولِ خروجی با «ELF file SHA256» لاگ برد یکی نبود، آدرس‌ها معتبر نیستند.
      - name: Decode crash backtrace
        continue-on-error: true
        env:
          BACKTRACE: "0x4200f0a8 0x4200f185 0x4200f190 0x42008e09 0x42006e6a 0x420455ca"
        run: |
          ELF=.pio/build/esp32-s3-devkitc-1/firmware.elf
          echo "ELF SHA256 (16 char اول): $(sha256sum $ELF | cut -c1-16)"
          A2L=$(find ~/.platformio -name 'xtensa-esp32s3-elf-addr2line' | head -1)
          echo "addr2line: $A2L"
          $A2L -pfiaC -e $ELF $BACKTRACE

      # 4) آپلود فایل‌های نهایی فلش به‌عنوان Artifact
      #    شامل: firmware.bin, bootloader.bin, partitions.bin, spiffs.bin
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartouch-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/*.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
          if-no-files-found: error
          retention-days: 30
