name: Build Firmware

# اجرا: با هر push و Pull Request (روی همه برنچ‌ها)، و امکان اجرای دستی از تب Actions
#
# توجه: دو مرحله‌ی قبلی «رمزگشایی بک‌تریس کرش» و «بازرسی محل کرش
# TFT_eSPI» از این فایل حذف شدند. آن دو مرحله برای یک جلسه‌ی دیباگ
# مشخص در گذشته نوشته شده بودند (با آدرس‌های حافظه‌ی هاردکد مخصوص
# همان کرش خاص) و در بیلد پایدار/تجاری هر بار همان آدرس‌های قدیمی و
# بی‌ربط را روی فریمویر جدید اجرا می‌کردند - که یا بی‌فایده بود یا
# گمراه‌کننده. اگر لازم شد یک کرش واقعی جدید دیباگ شود، این دو مرحله
# را می‌توان موقتاً و با آدرس‌های تازه به یک workflow_dispatch جدا
# اضافه کرد، نه اینکه در بیلد اصلی هر push بمانند.
on:
  push:
  pull_request:
  workflow_dispatch:

# اگر روی یک برنچ چند push پشت‌سرهم بیاید، بیلد قدیمی‌تر لغو می‌شود
# (به‌جای اینکه چند بیلد هم‌زمان صف بکشند و runner minutes هدر برود)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# پیش‌فرض GitHub برای permissions می‌تواند به‌قدر نیاز کار write هم
# بدهد؛ چون این workflow فقط می‌خواند/کامپایل می‌کند و چیزی به ریپو
# پس نمی‌نویسد، صریحاً به read-only محدود می‌شود (اصل کمترین دسترسی -
# همان روحیه‌ی امنیتی که در بقیه‌ی پروژه رعایت شده)
permissions:
  contents: read

jobs:
  build:
    name: Build (esp32-s3-devkitc-1)
    runs-on: ubuntu-latest
    # جلوی یک runner گیرکرده/هنگ را می‌گیرد (پیش‌فرض GitHub ۳۶۰ دقیقه‌ست)
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # کش کردن کل دایرکتوری PlatformIO (پکیج‌ها/پلتفرم‌ها) برای سرعت بیشتر در اجراهای بعدی
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        # نسخه‌ی اصلی روی ۶ پین شده تا یک major release جدید و
        # ناسازگار بی‌خبر بیلد را خراب نکند؛ رفع نسخه (patch/minor)
        # همچنان آزاد است تا رفع باگ‌های PlatformIO خودکار برسد
        run: pip install "platformio>=6.1,<7"

      # 1) کامپایل فریمویر - مرحله اصلی تست/اعتبارسنجی
      #    اگه کد خطای کامپایل داشته باشه، اینجا fail میشه
      - name: Build firmware
        run: pio run -e esp32-s3-devkitc-1

      # 2) ساخت ایمیج فایل‌سیستم از پوشه data/ (index.html, app.js, style.css, dbc/*)
      #    بدون این مرحله spiffs.bin ساخته نمیشه و webserver نمی‌تونه فایل‌های وب رو سرو کنه
      - name: Build filesystem image (SPIFFS)
        run: pio run -e esp32-s3-devkitc-1 -t buildfs

      # 3) تحلیل استاتیک - فقط اطلاع‌رسانی، بیلد رو fail نمی‌کنه
      - name: Static analysis
        run: pio check -e esp32-s3-devkitc-1 --skip-packages
        continue-on-error: true

      # 4) آپلود فایل‌های نهایی فلش به‌عنوان Artifact
      #    شامل: firmware.bin, bootloader.bin, partitions.bin, spiffs.bin, firmware.elf
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cartouch-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/*.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
          if-no-files-found: error
          retention-days: 30
