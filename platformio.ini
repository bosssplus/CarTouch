; CarTouch - ESP32-S3 Car Control via CAN Bus
; PlatformIO Project Configuration File
;
; برای کامپایل و آپلود:
;   pio run -t upload
; برای آپلود فایل‌های SPIFFS (وب):
;   pio run -t uploadfs

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = opi
board_build.psram = enable
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; بهینه‌سازی برای LVGL و TFT
build_flags =
    ; فعال‌سازی PSRAM برای بافر LVGL
    -DBOARD_HAS_PSRAM
    -DCONFIG_LVGL_USE_PSRAM=1
    ; بهینه‌سازی کامپایلر
    -O2
    -DF_CPU=240000000L
    ; TFT_eSPI تنظیمات
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_CS=10
    -DTFT_DC=7
    -DTFT_RST=4
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=21
    -DTOUCH_CS=14
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; LVGL تنظیمات
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_USE_PERF_MONITOR=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEMCPY_MEMSET_STD=1
    -DLV_USE_IME_PINYIN=0
    -DLV_USE_FLOAT=1

; کتابخانه‌های مورد نیاز
lib_deps =
    ; TFT نمایشگر
    bodmer/TFT_eSPI@^2.5.43
    ; LVGL نسخه 8
    lvgl/lvgl@^8.4.0
    ; وب سرور Async
    me-no-dev/ESPAsyncWebServer@^3.7.1
    ; WebSocket
    me-no-dev/AsyncTCP@^3.3.0
    ; یا برای ESP32-S3 از AsyncTCP_SSL استفاده کنید
    ; کار با JSON
    bblanchon/ArduinoJson@^7.2.0
    ; مدیریت WiFi
    ; توکار ESP32 - نیازی به کتابخانه جدا نیست

lib_ignore =
    ; نادیده گرفتن کتابخانه‌های اضافی در صورت تداخل

; پارتیشن‌بندی حافظه
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
