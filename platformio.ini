; CarTouch - ESP32-S3 Car Control via CAN Bus
; PlatformIO Project Configuration File
;
; برای کامپایل و آپلود:
;   pio run -t upload
; برای آپلود فایل‌های SPIFFS (وب):
;   pio run -t uploadfs

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; This profile uses a 16MB partition map. Build success does not verify the physical board.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram = enable
board_build.f_cpu = 240000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCT_REQUIRED_FLASH_BYTES=16777216
    -DCONFIG_LVGL_USE_PSRAM=1
    -O2
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_CS=10
    -DTFT_DC=7
    -DTFT_RST=4
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_BL=21
    -DUSE_FSPI_PORT
    -DTOUCH_CS=14
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLV_CONF_SKIP=1
    -DLV_USE_PERF_MONITOR=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEMCPY_MEMSET_STD=1
    -DLV_USE_IME_PINYIN=0
    -DLV_USE_FLOAT=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_48=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.4.0
    ESP32Async/ESPAsyncWebServer@^3.7.0
    ESP32Async/AsyncTCP@^3.3.0
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^2.3.6
    autowp/autowp-mcp2515@^1.3.1

lib_ignore =

board_build.partitions = cartouch_16MB.csv
board_upload.flash_size = 16MB
check_flags = --suppress=preprocessorErrorDirective:*

[env:esp32-s3-headless]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DCARTOUCH_HEADLESS=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<can_service.cpp>
build_flags = -std=c++11 -Isrc
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
